
name: Build Cash-IQ APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7 @capacitor/assets

      - name: Prepare app files
        run: |
          mkdir -p www assets
          cp app.html www/index.html
          cp app-icon.png assets/icon.png
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ghanashyam.expensetracker",
            "appName": "Cash-IQ",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Align Kotlin dependencies
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' &&
                          details.requested.name in [
                              'kotlin-stdlib',
                              'kotlin-stdlib-jdk7',
                              'kotlin-stdlib-jdk8'
                          ]) {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }
          EOF

      - name: Generate app icon
        run: npx capacitor-assets generate --android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cash-IQ-1.1.1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
